<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frises-Chronos — Éditeur de frises chronologiques</title>

  <link rel="stylesheet" href="https://unpkg.com/vis-timeline@7.12.2/styles/vis-timeline-graph2d.min.css" />
  <link rel="stylesheet" href="css/editor.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="editor-shell">

    <header class="topbar">

      <div class="topbar-left">
        <div class="brand-row">
          <img src="assets/logo.png" alt="Frises-Chronos" class="brand-logo" />

          <div>
            <p class="brand-name">Frises-Chronos</p>
            <p class="brand-tag">Éditeur de frises chronologiques</p>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="themeToggle">Mode clair</button>
        <button class="btn btn-primary" id="saveProjectBtn">Sauvegarder</button>
        <button class="btn btn-secondary" id="exportPngBtn">Exporter PNG</button>
        <button class="btn btn-secondary" id="exportPdfBtn">Exporter PDF</button>
        <button class="btn btn-ghost" id="loadProjectBtn">Ouvrir .bin</button>

        <input type="file" id="projectFile" accept=".bin" hidden />
      </div>

    </header>

    <main class="editor-grid">
